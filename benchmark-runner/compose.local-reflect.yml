name: ${REFLECT_PROJECT}
x-hindsight: &hindsight
  image: ${REFLECT_HINDSIGHT_IMAGE}
  environment:
    HINDSIGHT_API_DATABASE_BACKEND: postgresql
    HINDSIGHT_API_DATABASE_URL: postgresql://benchmark:benchmark@db:5432/benchmark
    HINDSIGHT_API_HOST: 0.0.0.0
    HINDSIGHT_API_PORT: "8888"
    HINDSIGHT_API_VECTOR_EXTENSION: pgvector
    HINDSIGHT_ENABLE_API: "true"
    HINDSIGHT_ENABLE_CP: "false"
  extra_hosts: [host.docker.internal:host-gateway]
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
    interval: 5s
    timeout: 10s
    retries: 60
    start_period: 20s
services:
  db:
    extends:
      file: compose.local-quality.yml
      service: db
  ingest:
    <<: *hindsight
    env_file: ["${REFLECT_INGEST_ENV_FILE}"]
    ports: ["127.0.0.1:${REFLECT_INGEST_PORT}:8888"]
  redhat:
    <<: *hindsight
    env_file: ["${REFLECT_REDHAT_ENV_FILE}"]
    ports: ["127.0.0.1:${REFLECT_REDHAT_PORT}:8888"]
  production:
    <<: *hindsight
    env_file: ["${REFLECT_PRODUCTION_ENV_FILE}"]
    ports: ["127.0.0.1:${REFLECT_PRODUCTION_PORT}:8888"]
